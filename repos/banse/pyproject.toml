[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banse"
version = "0.1.0"
description = "Read-only basketball statistics API backed by DuckDB"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.4,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pytz>=2024.1"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
banse = "banse.server:main"

[tool.setuptools.packages.find]
where = ["src"]
